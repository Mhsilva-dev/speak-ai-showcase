name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: speak
          POSTGRES_PASSWORD: speak
          POSTGRES_DB: speak_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U speak"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://speak:speak@localhost:5432/speak_test
      TEST_DATABASE_URL: postgres://speak:speak@localhost:5432/speak_test
      JWT_SECRET: ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Verificar sintaxe do front-end
        run: find public -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Testes (IA simulada, banco PostgreSQL de teste)
        run: npm test
