<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
<defs>
  <radialGradient id="bg" cx="50%" cy="36%" r="78%"><stop offset="0" stop-color="#2c2170"/><stop offset=".5" stop-color="#15163c"/><stop offset="1" stop-color="#0b0c1a"/></radialGradient>
  <radialGradient id="orb" gradientUnits="userSpaceOnUse" cx="420" cy="380" r="470">
    <stop offset="0" stop-color="#ffffff"/><stop offset=".08" stop-color="#ffe1d1"/><stop offset=".3" stop-color="#ff9466"/>
    <stop offset=".56" stop-color="#f0567a"/><stop offset=".82" stop-color="#7c5cff"/><stop offset="1" stop-color="#2b1f72"/></radialGradient>
  <radialGradient id="shade" gradientUnits="userSpaceOnUse" cx="640" cy="660" r="330"><stop offset="0" stop-color="#120840" stop-opacity=".55"/><stop offset="1" stop-color="#120840" stop-opacity="0"/></radialGradient>
  <radialGradient id="spec" gradientUnits="userSpaceOnUse" cx="410" cy="350" r="120"><stop offset="0" stop-color="#fff" stop-opacity=".85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
  <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffb08f"/><stop offset=".5" stop-color="#ffffff"/><stop offset="1" stop-color="#b7a9ff"/></linearGradient>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="38"/></filter>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
  <pattern id="dots" width="44" height="44" patternUnits="userSpaceOnUse"><circle cx="22" cy="22" r="2.4" fill="#fff" fill-opacity=".07"/></pattern>
  <clipPath id="front"><rect x="-200" y="512" width="1424" height="700"/></clipPath>
  <clipPath id="bubble"><circle cx="512" cy="500" r="268"/><path d="M330 620 Q300 720 250 790 Q360 770 440 722 Z"/></clipPath>
  <clipPath id="tile"><rect width="1024" height="1024" rx="230"/></clipPath>
</defs>
<g clip-path="url(#tile)">
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#dots)"/>
  <g transform="translate(512 512) scale(1) translate(-512 -512)">
    <ellipse cx="512" cy="820" rx="250" ry="52" fill="#7c5cff" opacity=".55" filter="url(#blur)"/>
    <g transform="rotate(-16 512 512)">
      <ellipse cx="512" cy="512" rx="400" ry="112" fill="none" stroke="url(#ring)" stroke-opacity=".38" stroke-width="12"/>
    </g>
    <!-- balão de fala: esfera + rabinho -->
    <g clip-path="url(#bubble)"><rect width="1024" height="1024" fill="url(#orb)"/><rect width="1024" height="1024" fill="url(#shade)"/></g>
    <ellipse cx="410" cy="350" rx="120" ry="84" fill="url(#spec)" transform="rotate(-30 410 350)"/>
    <!-- ondas de voz -->
    <g fill="#ffffff">
      <rect x="361" y="454" width="38" height="92" rx="19" fill-opacity="0.94"/><rect x="427" y="412" width="38" height="176" rx="19" fill-opacity="0.94"/><rect x="493" y="375" width="38" height="250" rx="19" fill-opacity="1"/><rect x="559" y="412" width="38" height="176" rx="19" fill-opacity="0.94"/><rect x="625" y="454" width="38" height="92" rx="19" fill-opacity="0.94"/>
    </g>
    <g transform="rotate(-16 512 512)" clip-path="url(#front)">
      <ellipse cx="512" cy="512" rx="400" ry="112" fill="none" stroke="url(#ring)" stroke-width="12"/>
      <circle cx="845" cy="574" r="26" fill="#ffb547"/><circle cx="845" cy="574" r="26" fill="#fff" fill-opacity=".25" filter="url(#soft)"/>
    </g>
  </g>
</g>
</svg>