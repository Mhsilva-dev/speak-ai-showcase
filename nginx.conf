# Referência de configuração do Nginx (HTTPS com Let's Encrypt, cabeçalhos de segurança e WebSocket da voz ao vivo)
server {
    listen 80;
    listen [::]:80;
    server_name speak.seu-dominio.com.br;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; allow all; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name speak.seu-dominio.com.br;

    ssl_certificate     /etc/letsencrypt/live/speak.seu-dominio.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/speak.seu-dominio.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # microfone liberado para o "🎤 Repetir"
    add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self';" always;
    server_tokens off;

    access_log /var/log/nginx/speak.access.log;
    error_log  /var/log/nginx/speak.error.log;
    client_max_body_size 15M;

    # Aula ao vivo por voz (WebSocket)
    location /api/live/ {
        proxy_pass http://127.0.0.1:3020;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://127.0.0.1:3020;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # IA pode levar até ~2 min percorrendo modelos reserva
        proxy_read_timeout 180;
        proxy_send_timeout 60;
    }
}
